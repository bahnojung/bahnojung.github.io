    <script>
      const MONDRIAN_COLORS = ["#FFD000", "#E53935", "#1565C0", "#00C853", "#FF4081"];

      function colorizeLetters(element) {
        const text = element.textContent || "";
        element.textContent = "";
        let prevColor = null;
        for (const ch of text) {
          if (ch === " ") {
            element.appendChild(document.createTextNode(" "));
            continue;
          }
          const choices = prevColor
            ? MONDRIAN_COLORS.filter((c) => c !== prevColor)
            : MONDRIAN_COLORS;
          const color = choices[Math.floor(Math.random() * choices.length)];
          prevColor = color;
          const span = document.createElement("span");
          span.textContent = ch;
          span.style.color = color;
          element.appendChild(span);
        }
      }

      // URL에서 컬렉션 파라미터 가져오기
      const urlParams = new URLSearchParams(window.location.search);
      const collectionId = urlParams.get("collection") || "all";

      // 전역 변수: 이미지 배열과 현재 인덱스
      let imageList = [];
      let currentImageIndex = -1;
      const backToMainEl = document.getElementById("back-to-main");

      // 현재 페이지 기준 베이스 경로 (로컬: /, GitHub Pages 커스텀 도메인/프로젝트 경로 모두 대응)
      const basePath = window.location.pathname.replace(/\/[^/]*$/, "/") || "/";

      // 현재 컬렉션 id + 파일명으로 이미지 URL 생성 (폴더명 변경 후에도 항상 올바른 경로)
      function imageUrlForItem(colId, item) {
        if (!item || !item.src) return "";
        const filename = item.src.split("/").pop() || item.src;
        const path = "collections/" + encodeURIComponent(colId) + "/" + encodeURIComponent(filename);
        return window.location.origin + basePath + path;
      }

      function appendTextWithLinks(el, text) {
        const urlRe = /(https?:\/\/[^\s]+)/g;
        let lastIndex = 0;
        let match;
        while ((match = urlRe.exec(text)) !== null) {
          if (match.index > lastIndex) {
            el.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
          }
          const arrow = document.createElement("span");
          arrow.className = "gallery-intro-link-arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "← ";
          el.appendChild(arrow);
          const a = document.createElement("a");
          a.href = match[1];
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "gallery-intro-link";
          a.textContent = match[1];
          el.appendChild(a);
          lastIndex = match.index + match[1].length;
        }
        if (lastIndex < text.length) {
          el.appendChild(document.createTextNode(text.slice(lastIndex)));
        }
      }

      function appendCollectionIntro(about) {
        const aboutEl = document.getElementById("collection-about");
        if (!aboutEl || !about) return;

        const paragraphs = Array.isArray(about.paragraphs)
          ? about.paragraphs.filter((text) => !!text)
          : [];
        const hasContent = !!(about.date || about.location || about.credit || paragraphs.length);
        if (!hasContent) {
          aboutEl.innerHTML = "";
          aboutEl.hidden = true;
          return;
        }

        aboutEl.innerHTML = "";
        aboutEl.hidden = false;

        const inner = document.createElement("div");
        inner.className = "collection-about-inner";

        if (about.date) {
          const dateEl = document.createElement("p");
          dateEl.className = "gallery-intro-date";
          dateEl.textContent = about.date;
          inner.appendChild(dateEl);
        }

        if (about.location) {
          const locationEl = document.createElement("p");
          locationEl.className = "gallery-intro-location";
          locationEl.textContent = about.location;
          inner.appendChild(locationEl);
        }

        if (about.credit) {
          const creditEl = document.createElement("p");
          creditEl.className = "gallery-intro-credit";
          creditEl.textContent = "- " + about.credit + " -";
          inner.appendChild(creditEl);
        }

        if (paragraphs.length) {
          const body = document.createElement("div");
          body.className = "gallery-intro-body";
          paragraphs.forEach((text) => {
            const p = document.createElement("p");
            appendTextWithLinks(p, text);
            body.appendChild(p);
          });
          inner.appendChild(body);
        }

        aboutEl.appendChild(inner);
      }

      async function loadCollectionAbout(colId) {
        try {
          const aboutPath = `collections/${encodeURIComponent(colId)}/about.json`;
          const res = await fetch(aboutPath, { cache: "no-store" });
          if (!res.ok) return null;
          return await res.json();
        } catch (e) {
          return null;
        }
      }

      async function loadBookSpreads(colId) {
        try {
          const path = `collections/${encodeURIComponent(colId)}/spreads.json`;
          const res = await fetch(path, { cache: "no-store" });
          if (!res.ok) return null;
          const data = await res.json();
          return Array.isArray(data) ? data : null;
        } catch (e) {
          return null;
        }
      }

      async function renderCatalogGallery(galleryEl, about, colId) {
        // Sorika-style: 책 스프레드를 책상 위에 올려둔 3열 그리드 (데스크톱 샘플)
        document.documentElement.classList.remove("book-scroll");
        document.body.classList.remove("collection-book-page");
        document.body.classList.add("collection-catalog-page");
        galleryEl.className = "gallery gallery-layout-catalog";
        galleryEl.innerHTML = "";
        document.querySelectorAll(".catalog-meta, .book-scrub").forEach((el) => el.remove());

        const cols = Math.max(2, Math.min(4, Number(about && about.columns) || 3));
        galleryEl.style.setProperty("--catalog-cols", String(cols));
        galleryEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

        const flat = [];
        const maxPages = 90;
        for (let i = 1; i <= maxPages; i++) {
          const stem = String(i).padStart(2, "0");
          const src = `collections/${colId}/catalog/${stem}.jpg`;
          const item = { src, alt: `spread ${i}` };
          const idx = flat.length;
          flat.push(item);

          const fig = document.createElement("figure");
          fig.className = "catalog-spread gallery-item";
          const img = document.createElement("img");
          img.src = `${src}?v=20261113catalog`;
          img.alt = item.alt;
          img.decoding = "async";
          img.loading = i <= 9 ? "eager" : "lazy";
          if (i <= 3) img.fetchPriority = "high";
          img.addEventListener("click", () => openLightbox(idx));
          fig.appendChild(img);
          galleryEl.appendChild(fig);
        }

        imageList = flat;

        const meta = document.createElement("aside");
        meta.className = "catalog-meta";
        const title = document.createElement("h3");
        title.textContent = "LEO - DO";
        meta.appendChild(title);
        const credit = document.createElement("p");
        credit.className = "catalog-credit";
        credit.textContent = "Bahno Jung";
        meta.appendChild(credit);
        const ul = document.createElement("ul");
        const lines = [];
        if (about && about.date) lines.push(String(about.date));
        if (about && about.location) lines.push(String(about.location));
        lines.push("Photographed & sequenced by Bahno Jung");
        lines.push("Book spreads · desktop sample (3-up)");
        (about && Array.isArray(about.paragraphs) ? about.paragraphs.slice(0, 1) : []).forEach(
          (t) => lines.push(t)
        );
        lines.forEach((t) => {
          const li = document.createElement("li");
          li.textContent = t;
          ul.appendChild(li);
        });
        meta.appendChild(ul);
        galleryEl.insertAdjacentElement("afterend", meta);

        updateBackToMainVisibility();
        console.log("Leo-do catalog grid:", flat.length, "spreads ×", cols);
      }

      async function renderBookGallery(galleryEl, about, colId) {
        const spreads = await loadBookSpreads(colId);
        if (!spreads || !spreads.length) {
          console.error("spreads.json을 불러오지 못했습니다.");
          return;
        }

        document.documentElement.classList.add("book-scroll");
        document.body.classList.add("collection-book-page");
        galleryEl.classList.add("gallery-layout-book");
        galleryEl.innerHTML = "";

        const flat = [];
        const srcIndex = new Map();

        spreads.forEach((spread) => {
          const section = document.createElement("section");
          section.className = "book-spread";
          section.dataset.spreadId = String(spread.id || "");
          if (spread.kind === "cover") section.classList.add("is-cover");
          if (spread.kind === "intro") section.classList.add("is-intro");
          if (spread.kind === "back") section.classList.add("is-back");

          const stage = document.createElement("div");
          stage.className = "book-stage";

          if (spread.kind !== "cover" && spread.kind !== "back") {
            const spine = document.createElement("div");
            spine.className = "book-spine";
            spine.setAttribute("aria-hidden", "true");
            stage.appendChild(spine);
          }

          if (spread.kind === "cover") {
            const title = document.createElement("p");
            title.className = "book-cover-title";
            title.textContent = "LEO - DO";
            // 가로 유지 + 오른쪽 여백
            title.style.writingMode = "horizontal-tb";
            title.style.textOrientation = "mixed";
            title.style.left = "auto";
            title.style.right = "3.8%";
            title.style.top = "50%";
            title.style.bottom = "auto";
            title.style.transform = "translateY(-50%)";
            title.style.whiteSpace = "nowrap";
            title.style.textAlign = "right";
            stage.appendChild(title);
            const credit = document.createElement("p");
            credit.className = "book-cover-credit";
            credit.textContent = "Bahno Jung";
            stage.appendChild(credit);
          }

          if (spread.kind === "intro" && about) {
            const copy = document.createElement("div");
            copy.className = "book-intro-copy";
            const kicker = document.createElement("p");
            kicker.className = "book-intro-kicker";
            kicker.textContent = "IEODO";
            copy.appendChild(kicker);
            const paras = Array.isArray(about.paragraphs)
              ? about.paragraphs.filter(Boolean)
              : [];
            // 책 인트로처럼 앞 문단만 — 너무 길면 넘침
            paras.slice(0, 2).forEach((text) => {
              const p = document.createElement("p");
              p.textContent = text;
              copy.appendChild(p);
            });
            stage.appendChild(copy);
          }

          if (spread.kind === "back") {
            const mark = document.createElement("p");
            mark.className = "book-back-mark";
            mark.textContent = "LEO - DO";
            stage.appendChild(mark);
          }

          (spread.images || []).forEach((slot) => {
            if (!slot || !slot.src) return;
            const figure = document.createElement("figure");
            figure.className = "book-photo gallery-item";
            figure.style.setProperty("--book-l", (Number(slot.l) || 0) * 100 + "%");
            figure.style.setProperty("--book-t", (Number(slot.t) || 0) * 100 + "%");
            figure.style.setProperty("--book-w", (Number(slot.w) || 0) * 100 + "%");
            figure.style.setProperty("--book-h", (Number(slot.h) || 0) * 100 + "%");

            const item = {
              src: slot.src,
              alt: String(slot.num != null ? slot.num : bookPathStem(slot.src)),
            };
            let idx = srcIndex.get(slot.src);
            if (idx == null) {
              idx = flat.length;
              flat.push(item);
              srcIndex.set(slot.src, idx);
            }

            const img = document.createElement("img");
            img.src = imageUrlForItem(colId, item);
            img.alt = item.alt || "";
            img.decoding = "async";
            img.loading = flat.length <= 4 ? "eager" : "lazy";
            if (flat.length <= 2) img.fetchPriority = "high";
            img.addEventListener("click", () => openLightbox(idx));
            figure.appendChild(img);
            stage.appendChild(figure);
          });

          section.appendChild(stage);
          galleryEl.appendChild(section);
        });

        imageList = flat;

        // 인접 스프레드 이미지 미리 로드 (스크롤 스냅 시 빈 화면 방지)
        const spreadsEls = Array.from(galleryEl.querySelectorAll(".book-spread"));
        const warmSpread = (el) => {
          if (!el) return;
          el.querySelectorAll("img").forEach((img) => {
            if (img.loading === "lazy") img.loading = "eager";
          });
        };
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              const idx = spreadsEls.indexOf(entry.target);
              warmSpread(spreadsEls[idx - 1]);
              warmSpread(entry.target);
              warmSpread(spreadsEls[idx + 1]);
              warmSpread(spreadsEls[idx + 2]);
            });
          },
          { root: null, rootMargin: "120% 0px", threshold: 0.01 }
        );
        spreadsEls.forEach((el) => io.observe(el));
        warmSpread(spreadsEls[0]);
        warmSpread(spreadsEls[1]);

        updateBackToMainVisibility();
      }

      function bookPathStem(src) {
        const name = String(src || "").split("/").pop() || "";
        return name.replace(/\.(jpe?g|png|gif|webp)$/i, "");
      }

      // 컬렉션 폴더의 images.json을 불러와 갤러리를 채우는 스크립트
      async function loadGallery() {
        const galleryEl = document.getElementById("gallery");
        if (!galleryEl) return;

        if (collectionId === "all") {
          console.error("컬렉션 페이지는 'all'을 지원하지 않습니다.");
          return;
        }

        try {
          // 컬렉션 폴더의 images.json 경로 (# 등 특수문자 인코딩)
          const jsonPath = `collections/${encodeURIComponent(collectionId)}/images.json`;
          console.log("컬렉션 ID:", collectionId, "JSON 경로:", jsonPath);
          const res = await fetch(jsonPath, { cache: "no-store" });
          if (!res.ok) {
            console.error(`${jsonPath} 로드 실패:`, res.status);
            return;
          }
          const data = await res.json();
          const images = Array.isArray(data) ? data : data.images;
          if (!Array.isArray(images)) {
            console.error("images.json 형식이 올바르지 않습니다.");
            return;
          }

          const about = await loadCollectionAbout(collectionId);
          const introAfterFirst = !!(about && about.afterFirst);
          const forceLandscapeIds = new Set(
            (about && Array.isArray(about.forceLandscape) ? about.forceLandscape : []).map(String)
          );
          const forcePortraitIds = new Set(
            (about && Array.isArray(about.forcePortrait) ? about.forcePortrait : []).map(String)
          );
          const forceSoloIds = new Set(
            (about && Array.isArray(about.forceSolo) ? about.forceSolo : []).map(String)
          );
          const forceSoloRightIds = new Set(
            (about && Array.isArray(about.forceSoloRight) ? about.forceSoloRight : []).map(String)
          );
          const customOrder = about && Array.isArray(about.order) ? about.order.map(String) : null;
          const orderIndex = customOrder
            ? new Map(customOrder.map((id, i) => [id, i]))
            : null;

          const itemId = (item) =>
            (item.alt || item.src.split("/").pop() || "").replace(
              /\.(jpe?g|png|gif|webp)$/i,
              ""
            );

          // 전역 변수에 이미지 배열 저장 (기본: 작은 번호 → 큰 번호, about.sort=desc면 역순)
          const sortDesc = about && String(about.sort).toLowerCase() === "desc";
          imageList = images
            .filter((item) => item && item.src)
            .sort((a, b) => {
              if (orderIndex) {
                const ai = orderIndex.has(itemId(a)) ? orderIndex.get(itemId(a)) : Number.MAX_SAFE_INTEGER;
                const bi = orderIndex.has(itemId(b)) ? orderIndex.get(itemId(b)) : Number.MAX_SAFE_INTEGER;
                if (ai !== bi) return ai - bi;
              }
              const numOf = (item) => {
                const name = itemId(item);
                const m = name.match(/^(\d+(?:\.\d+)?)/);
                return m ? Number.parseFloat(m[1]) : null;
              };
              const an = numOf(a);
              const bn = numOf(b);
              if (an !== null && bn !== null && an !== bn) {
                return sortDesc ? bn - an : an - bn;
              }
              if (an !== null && bn === null) return -1;
              if (an === null && bn !== null) return 1;
              const cmp = String(a.alt || a.src).localeCompare(String(b.alt || b.src), "en", {
                numeric: true,
              });
              return sortDesc ? -cmp : cmp;
            });
          console.log("로드된 이미지 개수:", imageList.length);
          if (imageList.length > 0) {
            console.log("첫 번째 이미지 경로:", imageList[0].src);
          }

          // 카탈로그/책 스크롤은 맥·데스크톱만 — 폰·터치 태블릿은 예전 세로 나열
          const layoutName = about && String(about.layout).toLowerCase();
          const catalogPreferred =
            layoutName === "catalog" ||
            (collectionId === "Leo-do" && layoutName !== "book");
          const bookPreferred = layoutName === "book";
          const viewportW = Math.min(
            window.innerWidth || 9999,
            document.documentElement.clientWidth || 9999,
            (window.visualViewport && window.visualViewport.width) || 9999
          );
          const touchLike = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
          const desktopOk = viewportW >= 901 && !(touchLike && viewportW < 1280);
          const catalogLayout = catalogPreferred && desktopOk;
          const bookLayout = bookPreferred && desktopOk;

          if (catalogLayout) {
            await renderCatalogGallery(galleryEl, about, collectionId);
            const onResizeCatalog = () => {
              const w = Math.min(
                window.innerWidth || 9999,

            window.addEventListener("resize", onResizeCatalog, { passive: true });

          }

          if (bookLayout) {
            await renderBookGallery(galleryEl, about, collectionId);
            const onResizeBook = () => {

          // 책/카탈로그 모드 잔여 클래스 제거
          document.documentElement.classList.remove("book-scroll");

          if (about && !introAfterFirst) appendCollectionIntro(about);

          const pairLayout = about && String(about.layout).toLowerCase() === "pair";

          // Leo-do 모바일: 카탈로그/책 대신 한 장씩 세로 나열

          function buildSmoothPath(points) {
            if (!points.length) return "";
            if (points.length === 1) {
              return `M ${points[0].x} ${points[0].y}`;
            }
            let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
            for (let i = 0; i < points.length - 1; i++) {
              const p0 = points[Math.max(0, i - 1)];
              const p1 = points[i];
              const p2 = points[i + 1];
              const p3 = points[Math.min(points.length - 1, i + 2)];
              const cp1x = p1.x + (p2.x - p0.x) / 6;
              const cp1y = p1.y + (p2.y - p0.y) / 6;
              const cp2x = p2.x - (p3.x - p1.x) / 6;
              const cp2y = p2.y - (p3.y - p1.y) / 6;
              d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
            }
            return d;
          }

          function ensureForestPathSvg() {
            let svg = galleryEl.querySelector(".forest-path-svg");
            if (svg) return svg;
            const NS = "http://www.w3.org/2000/svg";
            svg = document.createElementNS(NS, "svg");
            svg.classList.add("forest-path-svg");
            svg.setAttribute("aria-hidden", "true");

            // SVG filter url(#id) breaks on ?query pages — draw crayon with layered strokes only
            [
              ["path-stroke-back", "32", "#145a22", "0.4"],
              ["path-stroke-mid", "18", "#2f9a3c", "0.95"],
              ["path-stroke-mid", "12", "#3aad48", "0.7"],
              ["path-stroke-edge", "7", "#8fd96a", "0.85"],
            ].forEach(([cls, width, color, opacity], i) => {
              const p = document.createElementNS(NS, "path");
              p.classList.add(cls);
              p.setAttribute("fill", "none");
              p.setAttribute("stroke", color);
              p.setAttribute("stroke-width", width);
              p.setAttribute("stroke-linecap", "round");
              p.setAttribute("stroke-linejoin", "round");
              p.setAttribute("opacity", opacity);
              p.dataset.layer = String(i);
              svg.appendChild(p);
            });
            galleryEl.insertBefore(svg, galleryEl.firstChild);
            return svg;
          }

          // 모바일과 같은 좁은 폭 기준 — 좌우·깊이·세로 간격 불규칙
          const PATH_RHYTHM = [
            { side: "left", inset: "0%", w: "68%", tilt: "-0.6deg", swing: 0.9, through: 0.2, mb: "1.1rem" },
            { side: "right", inset: "8%", w: "52%", tilt: "1.4deg", swing: 0.72, through: 0.78, mb: "2.8rem" },
            { side: "left", inset: "18%", w: "58%", tilt: "-1.6deg", swing: 0.55, through: 0.28, mb: "0.7rem" },
            { side: "left", inset: "3%", w: "72%", tilt: "-0.2deg", swing: 0.48, through: 0.15, mb: "3.4rem" },
            { side: "right", inset: "0%", w: "54%", tilt: "1.0deg", swing: 0.94, through: 0.85, mb: "1.6rem" },
            { side: "right", inset: "14%", w: "46%", tilt: "1.8deg", swing: 0.62, through: 0.7, mb: "2.2rem" },
            { side: "left", inset: "6%", w: "64%", tilt: "-1.1deg", swing: 0.84, through: 0.22, mb: "4.0rem" },
            { side: "right", inset: "4%", w: "70%", tilt: "0.5deg", swing: 0.66, through: 0.8, mb: "1.0rem" },
            { side: "left", inset: "22%", w: "48%", tilt: "-1.9deg", swing: 0.42, through: 0.35, mb: "2.5rem" },
            { side: "right", inset: "2%", w: "60%", tilt: "1.2deg", swing: 0.88, through: 0.88, mb: "0.55rem" },
            { side: "left", inset: "0%", w: "74%", tilt: "-0.4deg", swing: 0.96, through: 0.12, mb: "3.1rem" },
            { side: "right", inset: "16%", w: "50%", tilt: "1.5deg", swing: 0.5, through: 0.72, mb: "1.4rem" },
            { side: "left", inset: "10%", w: "56%", tilt: "-0.9deg", swing: 0.8, through: 0.25, mb: "2.0rem" },
            { side: "left", inset: "5%", w: "62%", tilt: "-1.3deg", swing: 0.7, through: 0.3, mb: "3.6rem" },
            { side: "right", inset: "1%", w: "66%", tilt: "0.7deg", swing: 0.91, through: 0.82, mb: "0.9rem" },
            { side: "right", inset: "12%", w: "44%", tilt: "2.0deg", swing: 0.58, through: 0.68, mb: "2.7rem" },
            { side: "left", inset: "4%", w: "58%", tilt: "-0.5deg", swing: 0.86, through: 0.18, mb: "1.8rem" },
            { side: "right", inset: "7%", w: "72%", tilt: "1.1deg", swing: 0.74, through: 0.9, mb: "4.2rem" },
            { side: "left", inset: "15%", w: "50%", tilt: "-1.7deg", swing: 0.46, through: 0.32, mb: "1.2rem" },
            { side: "right", inset: "3%", w: "60%", tilt: "0.4deg", swing: 0.83, through: 0.76, mb: "2.4rem" },
            { side: "left", inset: "1%", w: "70%", tilt: "-0.8deg", swing: 0.93, through: 0.14, mb: "0.65rem" },
            { side: "right", inset: "19%", w: "48%", tilt: "1.6deg", swing: 0.54, through: 0.7, mb: "3.0rem" },
            { side: "left", inset: "8%", w: "54%", tilt: "-1.0deg", swing: 0.77, through: 0.26, mb: "1.5rem" },
            { side: "right", inset: "0%", w: "68%", tilt: "0.9deg", swing: 0.89, through: 0.86, mb: "2.9rem" },
            { side: "left", inset: "12%", w: "52%", tilt: "-1.5deg", swing: 0.5, through: 0.34, mb: "0.8rem" },
            { side: "right", inset: "6%", w: "58%", tilt: "1.3deg", swing: 0.81, through: 0.74, mb: "3.5rem" },
            { side: "left", inset: "2%", w: "64%", tilt: "-0.3deg", swing: 0.95, through: 0.16, mb: "1.9rem" },
            { side: "right", inset: "11%", w: "46%", tilt: "1.7deg", swing: 0.64, through: 0.79, mb: "2.6rem" },
            { side: "left", inset: "5%", w: "60%", tilt: "-1.2deg", swing: 0.73, through: 0.24, mb: "1.3rem" },
            { side: "right", inset: "4%", w: "56%", tilt: "0.6deg", swing: 0.87, through: 0.84, mb: "2.1rem" },
          ];

          function pathRhythmFor(index) {
            return PATH_RHYTHM[index % PATH_RHYTHM.length];
          }

          function applyPathPlacement(figure, index, isLandscape) {
            figure.classList.remove("path-side-left", "path-side-right");
            figure.style.removeProperty("--path-inset");
            figure.style.removeProperty("--path-w");
            figure.style.removeProperty("--path-tilt");
            figure.style.removeProperty("--path-mb");
            figure.dataset.pathSwing = "";
            figure.dataset.pathThrough = "";
            if (isLandscape) {
              figure.style.setProperty("--path-mb", "2.4rem");
              return;
            }
            const rh = pathRhythmFor(index);
            figure.classList.add(rh.side === "left" ? "path-side-left" : "path-side-right");
            figure.style.setProperty("--path-inset", rh.inset);
            figure.style.setProperty("--path-w", rh.w);
            figure.style.setProperty("--path-tilt", rh.tilt);
            figure.style.setProperty("--path-mb", rh.mb || "2.1rem");
            figure.dataset.pathSwing = String(rh.swing);
            figure.dataset.pathThrough = String(rh.through);
          }

          function redrawForestPath() {
            if (!pathLayout) return;
            const svg = ensureForestPathSvg();
            const nodes = Array.from(galleryEl.children).filter(
              (el) =>
                el.classList &&
                (el.classList.contains("gallery-item") ||
                  el.classList.contains("collection-about-after-first"))
            );
            if (!nodes.length) return;

            const height = Math.max(galleryEl.scrollHeight, galleryEl.offsetHeight, 1);
            const width = Math.max(galleryEl.clientWidth, galleryEl.offsetWidth, 1);
            svg.style.position = "absolute";
            svg.style.left = "0";
            svg.style.top = "0";
            svg.style.width = `${width}px`;
            svg.style.height = `${height}px`;
            svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
            svg.setAttribute("width", String(width));
            svg.setAttribute("height", String(height));

            const gRect = galleryEl.getBoundingClientRect();
            const points = [];
            let photoStep = 0;
            nodes.forEach((el, i) => {
              const r = el.getBoundingClientRect();
              if (r.height < 2 || r.width < 2) return;
              const top = r.top - gRect.top + galleryEl.scrollTop;
              const left = r.left - gRect.left + galleryEl.scrollLeft;
              const midY = top + r.height * 0.5;
              const isPhoto = el.classList.contains("gallery-item");
              const isLeft = el.classList.contains("path-side-left");
              const isRight = el.classList.contains("path-side-right");
              const rh = isPhoto ? pathRhythmFor(Number(el.dataset.pathIndex || photoStep)) : null;
              const through = rh ? Number(rh.through) : 0.5;
              const swing = rh ? Number(rh.swing) : 0.8;

              const outerX = isLeft
                ? Math.max(12, left + r.width * Math.min(0.4, Math.max(0.08, through)))
                : isRight
                  ? Math.min(
                      width - 12,
                      left + r.width * Math.max(0.6, Math.min(0.92, through))
                    )
                  : left + r.width * 0.5;

              if (i === 0) {
                const startX = isLeft ? width * (1 - swing) : isRight ? width * swing : width * 0.5;
                points.push({ x: startX, y: Math.max(6, top - 28) });
              } else {
                const prev = nodes[i - 1].getBoundingClientRect();
                const gapY =
                  (prev.bottom - gRect.top + (r.top - gRect.top)) / 2 + galleryEl.scrollTop;
                // 사이 공백 꺾임: 얕게/깊게 섞기
                const gapSwing = rh ? swing : 0.75;
                const gapX = isLeft
                  ? width * gapSwing
                  : isRight
                    ? width * (1 - gapSwing)
                    : width * 0.5;
                points.push({ x: gapX, y: gapY });
              }

              const yA = top + r.height * (0.12 + (photoStep % 3) * 0.05);
              const yB = midY + ((photoStep % 2) * 2 - 1) * r.height * 0.06;
              const yC = top + r.height * (0.72 + (photoStep % 4) * 0.04);
              points.push({ x: outerX, y: yA });
              points.push({
                x: outerX + (isLeft ? 6 + (photoStep % 5) * 3 : isRight ? -(6 + (photoStep % 5) * 3) : 0),
                y: yB,
              });
              points.push({ x: outerX, y: Math.min(top + r.height * 0.92, yC) });
              if (isPhoto) photoStep += 1;
            });

            if (points.length < 2) return;

            const last = points[points.length - 1];
            points.push({
              x: last.x + (last.x < width / 2 ? 24 + (photoStep % 4) * 8 : -(24 + (photoStep % 4) * 8)),
              y: last.y + 28 + (photoStep % 3) * 10,
            });

            const baseD = buildSmoothPath(points);
            svg.querySelectorAll("path").forEach((pathEl, idx) => {
              const ox = (idx - 1.5) * 1.8;
              const oy = (idx % 2 === 0 ? 1 : -1) * 1.2;
              const shifted = points.map((p, pi) => ({
                x: p.x + ox + Math.sin(pi * 0.9 + idx) * 2.2,
                y: p.y + oy,
              }));
              pathEl.setAttribute("d", buildSmoothPath(shifted) || baseD);
              pathEl.style.strokeDasharray = "none";
              pathEl.style.strokeDashoffset = "0";
              pathEl.removeAttribute("filter");
            });
          }

          let pathRedrawTimer = null;
          function scheduleForestPathRedraw() {
            if (!pathLayout) return;
            clearTimeout(pathRedrawTimer);
            pathRedrawTimer = setTimeout(redrawForestPath, 60);
          }

          function updatePairSolos() {
            if (!pairLayout) return;
            const children = Array.from(galleryEl.children);
            children.forEach((el) => {
              if (el.classList && el.classList.contains("gallery-item")) {
                el.classList.remove("gallery-item-solo");
              }
            });
            let pending = null;
            const flush = () => {
              if (pending) {
                pending.classList.add("gallery-item-solo");
                pending = null;
              }
            };
            for (const el of children) {
              if (!el.classList || !el.classList.contains("gallery-item")) {
                flush();
                continue;
              }
              if (el.classList.contains("force-solo")) {
                flush();
                el.classList.add("portrait");
                el.classList.remove("landscape");
                el.classList.add("gallery-item-solo");
                if (el.classList.contains("solo-right")) {
                  el.classList.add("solo-right");
                }
                continue;
              }
              const ready =
                el.classList.contains("portrait") || el.classList.contains("landscape");
              if (!ready) continue;
              if (el.classList.contains("landscape")) {
                flush();
                continue;
              }
              if (pending) {
                pending = null;
              } else {
                pending = el;
              }
            }
            flush();
          }

          let pathPhotoIndex = 0;
          imageList.forEach((item, index) => {
            const figure = document.createElement("figure");
            figure.className = "gallery-item";
            const id = itemId(item);
            figure.dataset.photoId = id;
            if (forceSoloIds.has(id)) {
              figure.classList.add("force-solo", "portrait", "gallery-item-solo");
              if (forceSoloRightIds.has(id)) figure.classList.add("solo-right");
            }

            const img = document.createElement("img");
            img.src = imageUrlForItem(collectionId, item);
            img.alt = item.alt || "";
            img.decoding = "async";
            // 모바일에서 전체 eager는 메모리로 일부 이미지가 비는 경우가 있어
            // 앞쪽만 eager, 나머지는 lazy (grid 순서/order는 DOM으로 고정)
            const eagerCount = gridLayout ? 8 : 15;
            img.loading =
              (gridLayout && index < eagerCount) ||
              ((pairLayout || pathLayout) && Number(id) <= eagerCount)
                ? "eager"
                : "lazy";
            if (index < 2) img.fetchPriority = "high";
            if (gridLayout) {
              figure.style.order = String(index);
            }

            const applyOrientation = () => {
              if (forceSoloIds.has(id)) {
                figure.classList.add("force-solo", "portrait", "gallery-item-solo");
                if (forceSoloRightIds.has(id)) figure.classList.add("solo-right");
                figure.classList.remove("landscape");
                updatePairSolos();
                scheduleForestPathRedraw();
                return;
              }
              if (!img.naturalWidth || !img.naturalHeight) return;
              let isLandscape = img.naturalWidth > img.naturalHeight;
              if (forceLandscapeIds.has(id)) isLandscape = true;
              if (forcePortraitIds.has(id)) isLandscape = false;
              figure.classList.toggle("landscape", isLandscape);
              figure.classList.toggle("portrait", !isLandscape);
              if (pathLayout) {
                const idx = Number(figure.dataset.pathIndex || 0);
                applyPathPlacement(figure, idx, isLandscape);
              }
              updatePairSolos();
              scheduleForestPathRedraw();
            };
            img.addEventListener("load", applyOrientation);
            if (img.complete) applyOrientation();

            img.addEventListener("click", () => {
              openLightbox(index);
            });

            if (slideLayout) {
              const shadow = document.createElement("div");
              shadow.className = "slide-mount-shadow";
              const mount = document.createElement("div");
              mount.className = "slide-mount-frame";
              const windowEl = document.createElement("div");
              windowEl.className = "slide-mount-window";
              windowEl.appendChild(img);
              mount.appendChild(windowEl);
              shadow.appendChild(mount);
              figure.appendChild(shadow);
            } else {
              figure.appendChild(img);
            }

            if (pathLayout) {
              figure.dataset.pathIndex = String(pathPhotoIndex);
              applyPathPlacement(figure, pathPhotoIndex, false);
              pathPhotoIndex += 1;
            }

            galleryEl.appendChild(figure);

            if (introAfterFirst && index === 0) {
              appendCollectionIntro(about);
              const aboutEl = document.getElementById("collection-about");
              if (aboutEl) {
                aboutEl.classList.add("collection-about-after-first");
                galleryEl.appendChild(aboutEl);
              }
              updatePairSolos();
              scheduleForestPathRedraw();
            }
          });

          updatePairSolos();
          if (pathLayout) {
            scheduleForestPathRedraw();
            window.addEventListener("resize", scheduleForestPathRedraw);
            if ("ResizeObserver" in window) {
              const ro = new ResizeObserver(scheduleForestPathRedraw);
              ro.observe(galleryEl);
            }
            const reveal = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    entry.target.classList.add("is-path-visible");
                    reveal.unobserve(entry.target);
                  }
                });
              },
              { rootMargin: "0px 0px -8% 0px", threshold: 0.12 }
            );
            galleryEl.querySelectorAll(".gallery-item").forEach((el) => reveal.observe(el));
            // redraw after fonts/images settle
            setTimeout(scheduleForestPathRedraw, 400);
            setTimeout(scheduleForestPathRedraw, 1200);
          }
        } catch (error) {
          console.error("갤러리 로드 중 오류:", error);
        }
      }

      function openLightbox(index) {
        if (index < 0 || index >= imageList.length) return;

        const lightbox = document.getElementById("lightbox");
        const img = document.getElementById("lightbox-image");
        if (!lightbox || !img) return;

        currentImageIndex = index;
        const item = imageList[index];
        img.src = imageUrlForItem(collectionId, item);
        img.alt = item.alt || "";

        updateNavButtons();

        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        const lightbox = document.getElementById("lightbox");
        if (!lightbox) return;

        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        currentImageIndex = -1;
      }

      function navigateImage(direction) {
        if (currentImageIndex < 0 || imageList.length === 0) return;

        let newIndex;
        if (direction === "next") {
          newIndex = (currentImageIndex + 1) % imageList.length;
        } else if (direction === "prev") {
          newIndex = (currentImageIndex - 1 + imageList.length) % imageList.length;
        } else {
          return;
        }

        const img = document.getElementById("lightbox-image");
        if (!img) return;

        const item = imageList[newIndex];
        img.src = imageUrlForItem(collectionId, item);
        img.alt = item.alt || "";
        currentImageIndex = newIndex;

        updateNavButtons();
      }

      function updateNavButtons() {
        const prevBtn = document.querySelector(".lightbox-nav-prev");
        const nextBtn = document.querySelector(".lightbox-nav-next");

        if (prevBtn && nextBtn) {
          prevBtn.style.display = imageList.length > 1 ? "flex" : "none";
          nextBtn.style.display = imageList.length > 1 ? "flex" : "none";
        }
      }

      function updateBackToMainVisibility() {
        if (!backToMainEl) return;
        const threshold = 6;
        const atBottom =
          window.innerHeight + window.scrollY >=
          document.documentElement.scrollHeight - threshold;
        backToMainEl.classList.toggle("is-visible", atBottom);
      }

      // 컬렉션 제목 표시: 폴더명(id)과 동일, _ 로 시작하면 _ 만 제거
      function displayName(id) {
        return id && id.startsWith("_") ? id.slice(1) : (id || "");
      }
      async function setCollectionTitle() {
        const titleEl = document.getElementById("collection-title");
        if (!titleEl) return;
        try {
          const res = await fetch("collections.json", { cache: "no-store" });
          if (!res.ok) return;
          const collections = await res.json();
          const c =
            Array.isArray(collections) &&
            collections.find((x) => x.id === collectionId);
          titleEl.textContent = c ? displayName(c.id) : displayName(collectionId);
          colorizeLetters(titleEl);
        } catch (e) {
          titleEl.textContent = displayName(collectionId);
          colorizeLetters(titleEl);
        }
      }

      // 터치 스와이프 감지
      let touchStartX = 0;
      let touchEndX = 0;
      let lightboxDidSwipe = false;

      function handleTouchStart(e) {
        touchStartX = e.changedTouches[0].screenX;
        lightboxDidSwipe = false;
      }

      function handleTouchEnd(e) {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }

      function handleSwipe() {
        const lightbox = document.getElementById("lightbox");
        if (!lightbox || !lightbox.classList.contains("is-open")) return;

        const swipeThreshold = 50; // 최소 스와이프 거리
        const diff = touchStartX - touchEndX;

        if (Math.abs(diff) > swipeThreshold) {
          lightboxDidSwipe = true;
          if (diff > 0) {
            // 왼쪽으로 스와이프 (다음 이미지)
            navigateImage("next");
          } else {
            // 오른쪽으로 스와이프 (이전 이미지)
            navigateImage("prev");
          }
        }
      }

      // 라이트박스 이벤트 바인딩
      (function setupLightboxEvents() {
        const lightbox = document.getElementById("lightbox");
        if (!lightbox) return;

        // 터치 이벤트 추가
        lightbox.addEventListener("touchstart", handleTouchStart, { passive: true });
        lightbox.addEventListener("touchend", handleTouchEnd, { passive: true });

        lightbox.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;

          if (lightboxDidSwipe) {
            lightboxDidSwipe = false;
            return;
          }

          if (target.hasAttribute("data-lightbox-nav")) {
            const direction = target.getAttribute("data-lightbox-nav");
            navigateImage(direction);
            return;
          }

          // 배경·X·사진 다시 탭 → 닫기 (뒤로 가는 느낌)
          if (
            target.hasAttribute("data-lightbox-close") ||
            target.id === "lightbox-image" ||
            target.classList.contains("lightbox-content") ||
            target.classList.contains("lightbox-backdrop") ||
            target === lightbox
          ) {
            closeLightbox();
          }
        });

        window.addEventListener("keydown", (event) => {
          const lightbox = document.getElementById("lightbox");
          if (!lightbox || !lightbox.classList.contains("is-open")) return;

          if (event.key === "Escape") {
            closeLightbox();
          } else if (event.key === "ArrowLeft") {
            navigateImage("prev");
          } else if (event.key === "ArrowRight") {
            navigateImage("next");
          }
        });
      })();

      window.addEventListener("scroll", updateBackToMainVisibility, { passive: true });
      window.addEventListener("resize", updateBackToMainVisibility);

      loadGallery();
      setCollectionTitle();
      window.addEventListener("load", updateBackToMainVisibility);
      setTimeout(updateBackToMainVisibility, 250);
    </script>
    <script src="music.js" defer></script>
  </body>
</html>
