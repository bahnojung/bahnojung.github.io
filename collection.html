  <body class="collection-page">
    <header class="site-header">
      <div class="header-inner">
        <div>
          <h1 class="site-title">
            <a href="index.html" class="site-title-link">Bahno Jung</a>
          </h1>
        </div>
      </div>
    </header>

    <main class="main-full">
      <h2 class="collection-title" id="collection-title"></h2>
      <aside class="collection-about" id="collection-about" hidden></aside>
      <section class="gallery" aria-label="사진 갤러리" id="gallery"></section>
    </main>

    <a href="index.html" class="collection-back-to-main" id="back-to-main" aria-label="메인 페이지로 이동">←</a>

    <!-- 클릭 시 확대 보기용 라이트박스 -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop" data-lightbox-close></div>
      <figure class="lightbox-content">
        <img id="lightbox-image" alt="" />
        <button
          class="lightbox-close"
          type="button"
          aria-label="확대 이미지 닫기"
          data-lightbox-close
        >
          ×
        </button>
      </figure>
      <button
        class="lightbox-nav lightbox-nav-prev"
        type="button"
        aria-label="이전 사진"
        data-lightbox-nav="prev"
      >
        ‹
      </button>
      <button
        class="lightbox-nav lightbox-nav-next"
        type="button"
        aria-label="다음 사진"
        data-lightbox-nav="next"
      >
        ›
      </button>
    </div>

    <script>
      const MONDRIAN_COLORS = ["#FFD000", "#E53935", "#1565C0", "#00C853", "#FF4081"];

      function colorizeLetters(element) {
        const text = element.textContent || "";
        element.textContent = "";
        let prevColor = null;
        for (const ch of text) {
          if (ch === " ") {
            element.appendChild(document.createTextNode(" "));
            continue;
          }
          const choices = prevColor
            ? MONDRIAN_COLORS.filter((c) => c !== prevColor)
            : MONDRIAN_COLORS;
          const color = choices[Math.floor(Math.random() * choices.length)];
          prevColor = color;
          const span = document.createElement("span");
          span.textContent = ch;
          span.style.color = color;
          element.appendChild(span);
        }
      }

      // URL에서 컬렉션 파라미터 가져오기
      const urlParams = new URLSearchParams(window.location.search);
      const collectionId = urlParams.get("collection") || "all";

      // 전역 변수: 이미지 배열과 현재 인덱스
      let imageList = [];
      let currentImageIndex = -1;
      const backToMainEl = document.getElementById("back-to-main");

      // 현재 페이지 기준 베이스 경로 (로컬: /, GitHub Pages 커스텀 도메인/프로젝트 경로 모두 대응)
      const basePath = window.location.pathname.replace(/\/[^/]*$/, "/") || "/";

      // 현재 컬렉션 id + 파일명으로 이미지 URL 생성 (폴더명 변경 후에도 항상 올바른 경로)
      function imageUrlForItem(colId, item) {
        if (!item || !item.src) return "";
        const filename = item.src.split("/").pop() || item.src;
        const path = "collections/" + encodeURIComponent(colId) + "/" + encodeURIComponent(filename);
        return window.location.origin + basePath + path;
      }

      function appendTextWithLinks(el, text) {
        const urlRe = /(https?:\/\/[^\s]+)/g;
        let lastIndex = 0;
        let match;
        while ((match = urlRe.exec(text)) !== null) {
          if (match.index > lastIndex) {
            el.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
          }
          const arrow = document.createElement("span");
          arrow.className = "gallery-intro-link-arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "← ";
          el.appendChild(arrow);
          const a = document.createElement("a");
          a.href = match[1];
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "gallery-intro-link";
          a.textContent = match[1];
          el.appendChild(a);
          lastIndex = match.index + match[1].length;
        }
        if (lastIndex < text.length) {
          el.appendChild(document.createTextNode(text.slice(lastIndex)));
        }
      }

      function appendCollectionIntro(about) {
        const aboutEl = document.getElementById("collection-about");
        if (!aboutEl || !about) return;

        const paragraphs = Array.isArray(about.paragraphs)
          ? about.paragraphs.filter((text) => !!text)
          : [];
        const hasContent = !!(about.date || about.location || about.credit || paragraphs.length);
        if (!hasContent) {
          aboutEl.innerHTML = "";
          aboutEl.hidden = true;
          return;
        }

        aboutEl.innerHTML = "";
        aboutEl.hidden = false;

        const inner = document.createElement("div");
        inner.className = "collection-about-inner";

        if (about.date) {
          const dateEl = document.createElement("p");
          dateEl.className = "gallery-intro-date";
          dateEl.textContent = about.date;
          inner.appendChild(dateEl);
        }

        if (about.location) {
          const locationEl = document.createElement("p");
          locationEl.className = "gallery-intro-location";
          locationEl.textContent = about.location;
          inner.appendChild(locationEl);
        }

        if (about.credit) {
          const creditEl = document.createElement("p");
          creditEl.className = "gallery-intro-credit";
          creditEl.textContent = "- " + about.credit + " -";
          inner.appendChild(creditEl);
        }

        if (paragraphs.length) {
          const body = document.createElement("div");
          body.className = "gallery-intro-body";
          paragraphs.forEach((text) => {
            const p = document.createElement("p");
            appendTextWithLinks(p, text);
            body.appendChild(p);
          });
          inner.appendChild(body);
        }

        aboutEl.appendChild(inner);
      }

      async function loadCollectionAbout(colId) {
        try {
          const aboutPath = `collections/${encodeURIComponent(colId)}/about.json`;
          const res = await fetch(aboutPath, { cache: "no-store" });
          if (!res.ok) return null;
          return await res.json();
        } catch (e) {
          return null;
        }
      }

      // 컬렉션 폴더의 images.json을 불러와 갤러리를 채우는 스크립트
      async function loadGallery() {
        const galleryEl = document.getElementById("gallery");
        if (!galleryEl) return;

        if (collectionId === "all") {
          console.error("컬렉션 페이지는 'all'을 지원하지 않습니다.");
          return;
        }

        try {
          // 컬렉션 폴더의 images.json 경로 (# 등 특수문자 인코딩)
          const jsonPath = `collections/${encodeURIComponent(collectionId)}/images.json`;
          console.log("컬렉션 ID:", collectionId, "JSON 경로:", jsonPath);
          const res = await fetch(jsonPath, { cache: "no-store" });
          if (!res.ok) {
            console.error(`${jsonPath} 로드 실패:`, res.status);
            return;
          }
          const data = await res.json();
          const images = Array.isArray(data) ? data : data.images;
          if (!Array.isArray(images)) {
            console.error("images.json 형식이 올바르지 않습니다.");
            return;
          }

          const about = await loadCollectionAbout(collectionId);
          const introAfterFirst = !!(about && about.afterFirst);
          const forceLandscapeIds = new Set(
            (about && Array.isArray(about.forceLandscape) ? about.forceLandscape : []).map(String)
          );
          const forcePortraitIds = new Set(
            (about && Array.isArray(about.forcePortrait) ? about.forcePortrait : []).map(String)
          );
          const forceSoloIds = new Set(
            (about && Array.isArray(about.forceSolo) ? about.forceSolo : []).map(String)
          );
          const forceSoloRightIds = new Set(
            (about && Array.isArray(about.forceSoloRight) ? about.forceSoloRight : []).map(String)
          );
          const customOrder = about && Array.isArray(about.order) ? about.order.map(String) : null;
          const orderIndex = customOrder
            ? new Map(customOrder.map((id, i) => [id, i]))
            : null;

          const itemId = (item) =>
            (item.alt || item.src.split("/").pop() || "").replace(
              /\.(jpe?g|png|gif|webp)$/i,
              ""
            );

          // 전역 변수에 이미지 배열 저장 (기본: 작은 번호 → 큰 번호, about.sort=desc면 역순)
          const sortDesc = about && String(about.sort).toLowerCase() === "desc";
          imageList = images
            .filter((item) => item && item.src)
            .sort((a, b) => {
              if (orderIndex) {
                const ai = orderIndex.has(itemId(a)) ? orderIndex.get(itemId(a)) : Number.MAX_SAFE_INTEGER;
                const bi = orderIndex.has(itemId(b)) ? orderIndex.get(itemId(b)) : Number.MAX_SAFE_INTEGER;
                if (ai !== bi) return ai - bi;
              }
              const numOf = (item) => {
                const name = itemId(item);
                const m = name.match(/^(\d+(?:\.\d+)?)/);
                return m ? Number.parseFloat(m[1]) : null;
              };
              const an = numOf(a);
              const bn = numOf(b);
              if (an !== null && bn !== null && an !== bn) {
                return sortDesc ? bn - an : an - bn;
              }
              if (an !== null && bn === null) return -1;
              if (an === null && bn !== null) return 1;
              const cmp = String(a.alt || a.src).localeCompare(String(b.alt || b.src), "en", {
                numeric: true,
              });
              return sortDesc ? -cmp : cmp;
            });
          console.log("로드된 이미지 개수:", imageList.length);
          if (imageList.length > 0) {
            console.log("첫 번째 이미지 경로:", imageList[0].src);
          }

          if (about && !introAfterFirst) appendCollectionIntro(about);

          const pairLayout = about && String(about.layout).toLowerCase() === "pair";
          const pathLayout =
            (about && String(about.layout).toLowerCase() === "path") ||
            collectionId === "Along the Forest Path";
          const stackLayout =
            ((about && String(about.layout).toLowerCase() === "stack") ||
              collectionId === "Sunflowers of Seoul") &&
            !pathLayout;
          const slideLayout =
            (about && String(about.layout).toLowerCase() === "slide") ||
            collectionId === "Colors of the Grow-rings";
          if (pairLayout) galleryEl.classList.add("gallery-layout-pair");
          if (pathLayout) {
            galleryEl.classList.add("gallery-layout-path");
            document.body.classList.add("collection-path-page");
          }
          if (stackLayout) {
            galleryEl.classList.add("gallery-layout-stack");
            if (!document.getElementById("stack-layout-fallback")) {
              const style = document.createElement("style");
              style.id = "stack-layout-fallback";
              style.textContent =
                ".gallery.gallery-layout-stack{display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;align-items:center;gap:0.85rem;width:100%;max-width:900px;margin:0 auto;padding:0}" +
                ".gallery.gallery-layout-stack .gallery-item{flex:0 0 auto!important;width:100%!important;height:auto!important;margin:0!important;padding:0!important;background:transparent}" +
                ".gallery.gallery-layout-stack .gallery-item.portrait{width:50%!important;max-width:450px}" +
                ".gallery.gallery-layout-stack .gallery-item.landscape{width:100%!important}" +
                ".gallery.gallery-layout-stack .gallery-item img{width:100%!important;height:auto!important;display:block;object-fit:contain!important}";
              document.head.appendChild(style);
            }
          }
          if (slideLayout) galleryEl.classList.add("gallery-layout-slide");

          function buildSmoothPath(points) {
            if (!points.length) return "";
            if (points.length === 1) {
              return `M ${points[0].x} ${points[0].y}`;
            }
            let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
            for (let i = 0; i < points.length - 1; i++) {
              const p0 = points[Math.max(0, i - 1)];
              const p1 = points[i];
              const p2 = points[i + 1];
              const p3 = points[Math.min(points.length - 1, i + 2)];
              const cp1x = p1.x + (p2.x - p0.x) / 6;
              const cp1y = p1.y + (p2.y - p0.y) / 6;
              const cp2x = p2.x - (p3.x - p1.x) / 6;
              const cp2y = p2.y - (p3.y - p1.y) / 6;
              d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
            }
            return d;
          }

          function ensureForestPathSvg() {
            let svg = galleryEl.querySelector(".forest-path-svg");
            if (svg) return svg;
            const NS = "http://www.w3.org/2000/svg";
            const uid = `fp-${Date.now().toString(36)}`;
            svg = document.createElementNS(NS, "svg");
            svg.classList.add("forest-path-svg");
            svg.setAttribute("aria-hidden", "true");
            svg.dataset.filterUid = uid;

            const defs = document.createElementNS(NS, "defs");
            const filter = document.createElementNS(NS, "filter");
            filter.setAttribute("id", `${uid}-crayon`);
            filter.setAttribute("x", "-40%");
            filter.setAttribute("y", "-40%");
            filter.setAttribute("width", "180%");
            filter.setAttribute("height", "180%");
            filter.innerHTML =
              '<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>' +
              '<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>';
            defs.appendChild(filter);
            svg.appendChild(defs);

            // 쿼리스트링 페이지에서도 필터가 먹도록 절대 해시 참조
            const filterRef = `url(#${uid}-crayon)`;
            [
              ["path-stroke-back", "28", "#1b6b2a", "0.35"],
              ["path-stroke-mid", "15", "#2f9a3c", "0.9"],
              ["path-stroke-edge", "6", "#7dce5c", "0.75"],
            ].forEach(([cls, width, color, opacity]) => {
              const p = document.createElementNS(NS, "path");
              p.classList.add(cls);
              p.setAttribute("fill", "none");
              p.setAttribute("stroke", color);
              p.setAttribute("stroke-width", width);
              p.setAttribute("stroke-linecap", "round");
              p.setAttribute("stroke-linejoin", "round");
              p.setAttribute("opacity", opacity);
              p.setAttribute("filter", filterRef);
              svg.appendChild(p);
            });
            galleryEl.insertBefore(svg, galleryEl.firstChild);
            return svg;
          }

          function redrawForestPath() {
            if (!pathLayout) return;
            const svg = ensureForestPathSvg();
            const nodes = Array.from(galleryEl.children).filter(
              (el) =>
                el.classList &&
                (el.classList.contains("gallery-item") ||
                  el.classList.contains("collection-about-after-first"))
            );
            if (!nodes.length) return;

            const height = Math.max(galleryEl.scrollHeight, galleryEl.offsetHeight, 1);
            const width = Math.max(galleryEl.clientWidth, galleryEl.offsetWidth, 1);
            svg.style.position = "absolute";
            svg.style.left = "0";
            svg.style.top = "0";
            svg.style.width = `${width}px`;
            svg.style.height = `${height}px`;
            svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
            svg.setAttribute("width", String(width));
            svg.setAttribute("height", String(height));

            const gRect = galleryEl.getBoundingClientRect();
            const points = [];
            nodes.forEach((el, i) => {
              const r = el.getBoundingClientRect();
              if (r.height < 2 || r.width < 2) return;
              const top = r.top - gRect.top + galleryEl.scrollTop;
              const left = r.left - gRect.left + galleryEl.scrollLeft;
              const midY = top + r.height * 0.5;
              const isLeft = el.classList.contains("path-side-left");
              const isRight = el.classList.contains("path-side-right");
              const outerX = isLeft
                ? Math.max(16, left + r.width * 0.18)
                : isRight
                  ? Math.min(width - 16, left + r.width * 0.82)
                  : left + r.width * 0.5;
              const farX = isLeft ? width * 0.1 : isRight ? width * 0.9 : width * 0.5;

              if (i === 0) {
                points.push({ x: farX, y: Math.max(6, top - 24) });
              } else {
                const prev = nodes[i - 1].getBoundingClientRect();
                const gapY =
                  (prev.bottom - gRect.top + (r.top - gRect.top)) / 2 + galleryEl.scrollTop;
                points.push({ x: isLeft ? width * 0.86 : width * 0.14, y: gapY });
              }
              points.push({ x: outerX, y: top + r.height * 0.2 });
              points.push({ x: outerX + (isLeft ? 8 : isRight ? -8 : 0), y: midY });
              points.push({ x: outerX, y: top + r.height * 0.8 });
            });

            if (points.length < 2) return;

            const last = points[points.length - 1];
            points.push({
              x: last.x + (last.x < width / 2 ? 32 : -32),
              y: last.y + 40,
            });

            const d = buildSmoothPath(points);
            svg.querySelectorAll("path").forEach((pathEl, idx) => {
              pathEl.setAttribute("d", d);
              pathEl.style.strokeDasharray = "none";
              pathEl.style.strokeDashoffset = "0";
              if (idx === 0) pathEl.setAttribute("transform", "translate(1.2, 0.4)");
              if (idx === 2) pathEl.setAttribute("transform", "translate(-1, -0.6)");
            });
          }

          let pathRedrawTimer = null;
          function scheduleForestPathRedraw() {
            if (!pathLayout) return;
            clearTimeout(pathRedrawTimer);
            pathRedrawTimer = setTimeout(redrawForestPath, 60);
          }

          function updatePairSolos() {
            if (!pairLayout) return;
            const children = Array.from(galleryEl.children);
            children.forEach((el) => {
              if (el.classList && el.classList.contains("gallery-item")) {
                el.classList.remove("gallery-item-solo");
              }
            });
            let pending = null;
            const flush = () => {
              if (pending) {
                pending.classList.add("gallery-item-solo");
                pending = null;
              }
            };
            for (const el of children) {
              if (!el.classList || !el.classList.contains("gallery-item")) {
                flush();
                continue;
              }
              if (el.classList.contains("force-solo")) {
                flush();
                el.classList.add("portrait");
                el.classList.remove("landscape");
                el.classList.add("gallery-item-solo");
                if (el.classList.contains("solo-right")) {
                  el.classList.add("solo-right");
                }
                continue;
              }
              const ready =
                el.classList.contains("portrait") || el.classList.contains("landscape");
              if (!ready) continue;
              if (el.classList.contains("landscape")) {
                flush();
                continue;
              }
              if (pending) {
                pending = null;
              } else {
                pending = el;
              }
            }
            flush();
          }

          let pathPhotoIndex = 0;
          imageList.forEach((item, index) => {
            const figure = document.createElement("figure");
            figure.className = "gallery-item";
            const id = itemId(item);
            figure.dataset.photoId = id;
            if (forceSoloIds.has(id)) {
              figure.classList.add("force-solo", "portrait", "gallery-item-solo");
              if (forceSoloRightIds.has(id)) figure.classList.add("solo-right");
            }

            const img = document.createElement("img");
            img.src = imageUrlForItem(collectionId, item);
            img.alt = item.alt || "";
            img.loading = (pairLayout || pathLayout) && Number(id) <= 15 ? "eager" : "lazy";

            const applyOrientation = () => {
              if (forceSoloIds.has(id)) {
                figure.classList.add("force-solo", "portrait", "gallery-item-solo");
                if (forceSoloRightIds.has(id)) figure.classList.add("solo-right");
                figure.classList.remove("landscape");
                updatePairSolos();
                scheduleForestPathRedraw();
                return;
              }
              if (!img.naturalWidth || !img.naturalHeight) return;
              let isLandscape = img.naturalWidth > img.naturalHeight;
              if (forceLandscapeIds.has(id)) isLandscape = true;
              if (forcePortraitIds.has(id)) isLandscape = false;
              figure.classList.toggle("landscape", isLandscape);
              figure.classList.toggle("portrait", !isLandscape);
              if (pathLayout) {
                figure.classList.remove("path-side-left", "path-side-right");
                if (!isLandscape) {
                  const idx = Number(figure.dataset.pathIndex || 0);
                  figure.classList.add(idx % 2 === 0 ? "path-side-left" : "path-side-right");
                }
              }
              updatePairSolos();
              scheduleForestPathRedraw();
            };
            img.addEventListener("load", applyOrientation);
            if (img.complete) applyOrientation();

            img.addEventListener("click", () => {
              openLightbox(index);
            });

            if (slideLayout) {
              const shadow = document.createElement("div");
              shadow.className = "slide-mount-shadow";
              const mount = document.createElement("div");
              mount.className = "slide-mount-frame";
              const windowEl = document.createElement("div");
              windowEl.className = "slide-mount-window";
              windowEl.appendChild(img);
              mount.appendChild(windowEl);
              shadow.appendChild(mount);
              figure.appendChild(shadow);
            } else {
              figure.appendChild(img);
            }

            if (pathLayout) {
              const side = pathPhotoIndex % 2 === 0 ? "left" : "right";
              figure.classList.add(side === "left" ? "path-side-left" : "path-side-right");
              figure.dataset.pathIndex = String(pathPhotoIndex);
              pathPhotoIndex += 1;
            }

            galleryEl.appendChild(figure);

            if (introAfterFirst && index === 0) {
              appendCollectionIntro(about);
              const aboutEl = document.getElementById("collection-about");
              if (aboutEl) {
                aboutEl.classList.add("collection-about-after-first");
                galleryEl.appendChild(aboutEl);
              }
              updatePairSolos();
              scheduleForestPathRedraw();
            }
          });

          updatePairSolos();
          if (pathLayout) {
            scheduleForestPathRedraw();
            window.addEventListener("resize", scheduleForestPathRedraw);
            if ("ResizeObserver" in window) {
              const ro = new ResizeObserver(scheduleForestPathRedraw);
              ro.observe(galleryEl);
            }
            const reveal = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    entry.target.classList.add("is-path-visible");
                    reveal.unobserve(entry.target);
                  }
                });
              },
              { rootMargin: "0px 0px -8% 0px", threshold: 0.12 }
            );
            galleryEl.querySelectorAll(".gallery-item").forEach((el) => reveal.observe(el));
            // redraw after fonts/images settle
            setTimeout(scheduleForestPathRedraw, 400);
            setTimeout(scheduleForestPathRedraw, 1200);
          }
        } catch (error) {
          console.error("갤러리 로드 중 오류:", error);
        }
      }

      function openLightbox(index) {
        if (index < 0 || index >= imageList.length) return;

        const lightbox = document.getElementById("lightbox");
        const img = document.getElementById("lightbox-image");
        if (!lightbox || !img) return;

        currentImageIndex = index;
        const item = imageList[index];
        img.src = imageUrlForItem(collectionId, item);
        img.alt = item.alt || "";

        updateNavButtons();

        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        const lightbox = document.getElementById("lightbox");
        if (!lightbox) return;

        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        currentImageIndex = -1;
      }

      function navigateImage(direction) {
        if (currentImageIndex < 0 || imageList.length === 0) return;

        let newIndex;
        if (direction === "next") {
          newIndex = (currentImageIndex + 1) % imageList.length;
        } else if (direction === "prev") {
          newIndex = (currentImageIndex - 1 + imageList.length) % imageList.length;
        } else {
          return;
        }

        const img = document.getElementById("lightbox-image");
        if (!img) return;

        const item = imageList[newIndex];
        img.src = imageUrlForItem(collectionId, item);
        img.alt = item.alt || "";
        currentImageIndex = newIndex;

        updateNavButtons();
      }

      function updateNavButtons() {
        const prevBtn = document.querySelector(".lightbox-nav-prev");
        const nextBtn = document.querySelector(".lightbox-nav-next");

        if (prevBtn && nextBtn) {
          prevBtn.style.display = imageList.length > 1 ? "flex" : "none";
          nextBtn.style.display = imageList.length > 1 ? "flex" : "none";
        }
      }

      function updateBackToMainVisibility() {
        if (!backToMainEl) return;
        const threshold = 6;
        const atBottom =
          window.innerHeight + window.scrollY >=
          document.documentElement.scrollHeight - threshold;
        backToMainEl.classList.toggle("is-visible", atBottom);
      }

      // 컬렉션 제목 표시: 폴더명(id)과 동일, _ 로 시작하면 _ 만 제거
      function displayName(id) {
        return id && id.startsWith("_") ? id.slice(1) : (id || "");
      }
      async function setCollectionTitle() {
        const titleEl = document.getElementById("collection-title");
        if (!titleEl) return;
        try {
          const res = await fetch("collections.json", { cache: "no-store" });
          if (!res.ok) return;
          const collections = await res.json();
          const c =
            Array.isArray(collections) &&
            collections.find((x) => x.id === collectionId);
          titleEl.textContent = c ? displayName(c.id) : displayName(collectionId);
          colorizeLetters(titleEl);
        } catch (e) {
          titleEl.textContent = displayName(collectionId);
          colorizeLetters(titleEl);
        }
      }

      // 터치 스와이프 감지
      let touchStartX = 0;
      let touchEndX = 0;

      function handleTouchStart(e) {
        touchStartX = e.changedTouches[0].screenX;
      }

      function handleTouchEnd(e) {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }

      function handleSwipe() {
        const lightbox = document.getElementById("lightbox");
        if (!lightbox || !lightbox.classList.contains("is-open")) return;

        const swipeThreshold = 50; // 최소 스와이프 거리
        const diff = touchStartX - touchEndX;

        if (Math.abs(diff) > swipeThreshold) {
          if (diff > 0) {
            // 왼쪽으로 스와이프 (다음 이미지)
            navigateImage("next");
          } else {
            // 오른쪽으로 스와이프 (이전 이미지)
            navigateImage("prev");
          }
        }
      }

      // 라이트박스 이벤트 바인딩
      (function setupLightboxEvents() {
        const lightbox = document.getElementById("lightbox");
        if (!lightbox) return;

        // 터치 이벤트 추가
        lightbox.addEventListener("touchstart", handleTouchStart, { passive: true });
        lightbox.addEventListener("touchend", handleTouchEnd, { passive: true });

        lightbox.addEventListener("click", (event) => {
          const target = event.target;
          if (
            target instanceof HTMLElement &&
            target.hasAttribute("data-lightbox-close")
          ) {
            closeLightbox();
          } else if (
            target instanceof HTMLElement &&
            target.hasAttribute("data-lightbox-nav")
          ) {
            const direction = target.getAttribute("data-lightbox-nav");
            navigateImage(direction);
          }
        });

        window.addEventListener("keydown", (event) => {
          const lightbox = document.getElementById("lightbox");
          if (!lightbox || !lightbox.classList.contains("is-open")) return;

          if (event.key === "Escape") {
            closeLightbox();
          } else if (event.key === "ArrowLeft") {
            navigateImage("prev");
          } else if (event.key === "ArrowRight") {
            navigateImage("next");
          }
        });
      })();

      window.addEventListener("scroll", updateBackToMainVisibility, { passive: true });
      window.addEventListener("resize", updateBackToMainVisibility);

      loadGallery();
      setCollectionTitle();
      window.addEventListener("load", updateBackToMainVisibility);
      setTimeout(updateBackToMainVisibility, 250);
    </script>
    <script src="music.js" defer></script>
  </body>
</html>
