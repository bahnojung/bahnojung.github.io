<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Contact — Bahno Jung</title>
    <meta name="description" content="Contact Bahno Jung." />
    <link rel="icon" href="data:," />
    <link
      rel="stylesheet"
      href="nevermind-bauhaus_font/NeverMindBauhaus/NeverMindBauhaus-Regular.ttf"
      as="font"
    />
    <link rel="stylesheet" href="style.css?v=20261011fonts" />
    <link rel="stylesheet" href="contact.css?v=20261011c1" />
  </head>
  <body class="contact-page">
    <header class="contact-top">
      <a href="index.html" class="contact-brand" id="contact-brand">Bahno Jung</a>
      <a href="mailto:jungbahno@gmail.com" class="contact-mail" id="contact-mail"
        >jungbahno@gmail.com</a
      >
    </header>

    <main class="contact-main">
      <div class="contact-intro">
        <h1 class="contact-heading" id="contact-heading">CONTACT</h1>
        <p class="contact-lede" id="contact-lede">
          For commissions, prints, and everything else —
        </p>
      </div>

      <p class="contact-sent" id="contact-sent" hidden>Message sent. Thank you.</p>

      <form
        class="contact-form"
        id="contact-form"
        action="https://formsubmit.co/jungbahno@gmail.com"
        method="POST"
      >
        <input type="hidden" name="_subject" value="Bahno Jung — Contact" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <input
          type="hidden"
          name="_next"
          value="https://bahnojung.github.io/contact.html?sent=1"
        />
        <input
          type="text"
          name="_honey"
          style="display: none"
          tabindex="-1"
          autocomplete="off"
        />

        <label class="contact-field">
          <span class="contact-label">Name</span>
          <input type="text" name="name" required autocomplete="name" />
        </label>

        <label class="contact-field">
          <span class="contact-label">Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>

        <label class="contact-field">
          <span class="contact-label">Phone</span>
          <input type="tel" name="phone" autocomplete="tel" />
        </label>

        <label class="contact-field contact-field-message">
          <span class="contact-label">Message</span>
          <textarea name="message" rows="3" required></textarea>
        </label>

        <div class="contact-actions">
          <button type="submit" class="contact-submit" id="contact-submit">
            Send
          </button>
        </div>
      </form>
    </main>

    <footer class="contact-foot">
      <span id="contact-foot">© Bahno Jung</span>
      <span class="contact-foot-sep" aria-hidden="true">·</span>
      <span class="contact-bio" id="contact-bio">born in korea (1996)</span>
    </footer>

    <script>
      (function () {
        var COLORS = ["#FFD000", "#E53935", "#1565C0", "#00C853", "#FF4081"];

        function colorizeLetters(element) {
          if (!element) return;
          var text = element.textContent || "";
          if (element.querySelector("span")) {
            text = Array.prototype.map
              .call(element.childNodes, function (n) {
                return n.textContent || "";
              })
              .join("");
          }
          element.textContent = "";
          var prev = null;
          for (var i = 0; i < text.length; i++) {
            var ch = text.charAt(i);
            if (ch === " ") {
              element.appendChild(document.createTextNode(" "));
              continue;
            }
            var pool = prev
              ? COLORS.filter(function (c) {
                  return c !== prev;
                })
              : COLORS;
            var color = pool[Math.floor(Math.random() * pool.length)];
            prev = color;
            var span = document.createElement("span");
            span.textContent = ch;
            span.setAttribute("style", "color:" + color + " !important");
            element.appendChild(span);
          }
        }

        function paintAll() {
          colorizeLetters(document.getElementById("contact-brand"));
          colorizeLetters(document.getElementById("contact-mail"));
          colorizeLetters(document.getElementById("contact-heading"));
          colorizeLetters(document.getElementById("contact-lede"));
          colorizeLetters(document.getElementById("contact-bio"));
          colorizeLetters(document.getElementById("contact-foot"));
          var labels = document.querySelectorAll(".contact-label");
          for (var i = 0; i < labels.length; i++) {
            colorizeLetters(labels[i]);
          }
          // Send는 흰 글씨 버튼으로 유지 (알록달록 칠하지 않음)
        }

        paintAll();
        setTimeout(paintAll, 0);

        var params = new URLSearchParams(window.location.search);
        if (params.get("sent") === "1") {
          var note = document.getElementById("contact-sent");
          var form = document.getElementById("contact-form");
          if (note) {
            note.hidden = false;
            colorizeLetters(note);
          }
          if (form) form.hidden = true;
        }
      })();
    </script>
  </body>
</html>
