<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Bahno Jung</title>
    <meta
      name="description"
      content="Contact Bahno Jung."
    />
    <link rel="icon" href="data:," />
    <link rel="shortcut icon" href="data:," />
    <link rel="apple-touch-icon" href="data:," />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contact — Bahno Jung" />
    <meta property="og:description" content="Contact Bahno Jung." />
    <meta property="og:image" content="https://bahnojung.github.io/og-bahnojung-v2.png?v=20260331b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=20261011contact2" />
  </head>
  <body class="contact-page">
    <header class="contact-top">
      <a href="index.html" class="contact-brand" id="contact-brand">Bahno Jung</a>
    </header>

    <main class="contact-main">
      <h1 class="contact-heading" id="contact-heading">CONTACT</h1>

      <p class="contact-sent" id="contact-sent" hidden>Message sent. Thank you.</p>

      <form
        class="contact-form"
        id="contact-form"
        action="https://formsubmit.co/jungbahno@gmail.com"
        method="POST"
      >
        <input type="hidden" name="_subject" value="Bahno Jung — Contact" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <input
          type="hidden"
          name="_next"
          value="https://bahnojung.github.io/contact.html?sent=1"
        />
        <input type="text" name="_honey" style="display: none" tabindex="-1" autocomplete="off" />

        <div class="contact-row">
          <label class="contact-field">
            <span class="contact-label">First name</span>
            <input type="text" name="first_name" required autocomplete="given-name" />
          </label>
          <label class="contact-field">
            <span class="contact-label">Last name</span>
            <input type="text" name="last_name" required autocomplete="family-name" />
          </label>
        </div>

        <div class="contact-row">
          <label class="contact-field">
            <span class="contact-label">Email</span>
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label class="contact-field">
            <span class="contact-label">Phone</span>
            <input type="tel" name="phone" autocomplete="tel" />
          </label>
        </div>

        <label class="contact-field contact-field-message">
          <span class="contact-label">Message</span>
          <textarea name="message" rows="8" required></textarea>
        </label>

        <div class="contact-actions">
          <button type="submit" class="contact-submit" id="contact-submit">Send</button>
        </div>
      </form>
    </main>

    <footer class="contact-foot">
      <span id="contact-foot">© Bahno Jung</span>
    </footer>

    <script>
      (function () {
        var MONDRIAN_COLORS = ["#FFD000", "#E53935", "#1565C0", "#00C853", "#FF4081"];

        function colorizeLetters(element) {
          if (!element) return;
          var text = element.textContent || "";
          element.textContent = "";
          var prevColor = null;
          for (var i = 0; i < text.length; i++) {
            var ch = text.charAt(i);
            if (ch === " ") {
              element.appendChild(document.createTextNode(" "));
              continue;
            }
            var choices = prevColor
              ? MONDRIAN_COLORS.filter(function (c) {
                  return c !== prevColor;
                })
              : MONDRIAN_COLORS;
            var color = choices[Math.floor(Math.random() * choices.length)];
            prevColor = color;
            var span = document.createElement("span");
            span.textContent = ch;
            span.style.color = color;
            element.appendChild(span);
          }
        }

        colorizeLetters(document.getElementById("contact-brand"));
        colorizeLetters(document.getElementById("contact-heading"));
        colorizeLetters(document.getElementById("contact-submit"));
        colorizeLetters(document.getElementById("contact-foot"));
        document.querySelectorAll(".contact-label").forEach(colorizeLetters);

        var params = new URLSearchParams(window.location.search);
        if (params.get("sent") === "1") {
          var note = document.getElementById("contact-sent");
          var form = document.getElementById("contact-form");
          if (note) {
            note.hidden = false;
            colorizeLetters(note);
          }
          if (form) form.hidden = true;
        }
      })();
    </script>
  </body>
</html>
