<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>warm warm day — Bahno Jung</title>
    <meta
      name="description"
      content="WARM WARM DAY ... WITH JI YONG and SUN YOU"
    />
    <meta property="og:title" content="warm warm day — Bahno Jung" />
    <meta
      property="og:description"
      content="WARM WARM DAY ... WITH JI YONG and SUN YOU"
    />
    <meta property="og:image" content="warm-warm-day/3.jpg" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c0b0a;
        --fg: #f4efe6;
        --muted: rgba(244, 239, 230, 0.72);
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "Outfit", system-ui, sans-serif;
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
      }

      body {
        overflow: hidden;
      }

      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        padding: calc(0.85rem + var(--safe-t)) 1.1rem 0.75rem;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          rgba(12, 11, 10, 0.72),
          rgba(12, 11, 10, 0)
        );
      }

      .topbar a,
      .topbar .brand {
        pointer-events: auto;
      }

      .brand {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.35rem, 3.2vw, 1.85rem);
        font-weight: 500;
        letter-spacing: 0.02em;
        text-decoration: none;
        color: var(--fg);
      }

      .home-link {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--muted);
      }

      .home-link:hover {
        color: var(--fg);
      }

      .deck {
        height: 100dvh;
        height: 100svh;
        overflow-y: auto;
        overflow-x: hidden;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }

      .slide {
        position: relative;
        height: 100dvh;
        height: 100svh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: grid;
        place-items: center;
        padding: calc(3.2rem + var(--safe-t)) 0.75rem
          calc(3.4rem + var(--safe-b));
      }

      .slide figure {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      .slide img {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        object-position: center;
        user-select: none;
        -webkit-user-drag: none;
      }

      .caption {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        padding: 1.5rem 1.1rem calc(0.95rem + var(--safe-b));
        text-align: center;
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(12, 11, 10, 0.78),
          rgba(12, 11, 10, 0)
        );
      }

      .caption p {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(0.92rem, 2.4vw, 1.15rem);
        font-style: italic;
        letter-spacing: 0.06em;
        color: var(--muted);
        line-height: 1.45;
      }

      .progress {
        position: fixed;
        right: 0.7rem;
        top: 50%;
        transform: translateY(-50%);
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }

      .progress button {
        width: 7px;
        height: 7px;
        border: 0;
        border-radius: 50%;
        padding: 0;
        background: rgba(244, 239, 230, 0.28);
        cursor: pointer;
      }

      .progress button[aria-current="true"] {
        background: var(--fg);
        transform: scale(1.25);
      }

      @media (min-width: 900px) {
        .slide {
          padding: calc(3.5rem + var(--safe-t)) 1.5rem
            calc(3.8rem + var(--safe-b));
        }

        .progress {
          right: 1.15rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="warm-warm-day.html">warm warm day</a>
      <a class="home-link" href="index.html">Bahno Jung</a>
    </header>

    <main class="deck" id="deck" aria-label="warm warm day photographs">
      <section class="slide" data-index="0">
        <figure>
          <img
            src="warm-warm-day/1.jpg"
            alt="Warm warm day — roundabout"
            width="3200"
            height="2090"
            decoding="async"
          />
        </figure>
      </section>
      <section class="slide" data-index="1">
        <figure>
          <img
            src="warm-warm-day/2.jpg"
            alt="Warm warm day — street"
            width="3200"
            height="2090"
            decoding="async"
          />
        </figure>
      </section>
      <section class="slide" data-index="2">
        <figure>
          <img
            src="warm-warm-day/3.jpg"
            alt="Warm warm day — Ji Yong and Sun You"
            width="3200"
            height="2060"
            decoding="async"
          />
        </figure>
      </section>
      <section class="slide" data-index="3">
        <figure>
          <img
            src="warm-warm-day/4.jpg"
            alt="Warm warm day — portrait"
            width="2061"
            height="3200"
            decoding="async"
          />
        </figure>
      </section>
      <section class="slide" data-index="4">
        <figure>
          <img
            src="warm-warm-day/5.jpg"
            alt="Warm warm day — park"
            width="2057"
            height="3200"
            decoding="async"
          />
        </figure>
      </section>
      <section class="slide" data-index="5">
        <figure>
          <img
            src="warm-warm-day/6.jpg"
            alt="Warm warm day — moon"
            width="2057"
            height="3200"
            decoding="async"
          />
        </figure>
      </section>
    </main>

    <aside class="caption">
      <p>WARM WARM DAY … WITH JI YONG and SUN YOU</p>
    </aside>

    <nav class="progress" id="progress" aria-label="Slides"></nav>

    <script>
      (function () {
        const deck = document.getElementById("deck");
        const slides = Array.from(deck.querySelectorAll(".slide"));
        const progress = document.getElementById("progress");

        slides.forEach((_, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.setAttribute("aria-label", "Photo " + (i + 1));
          if (i === 0) b.setAttribute("aria-current", "true");
          b.addEventListener("click", () => {
            slides[i].scrollIntoView({ behavior: "smooth", block: "start" });
          });
          progress.appendChild(b);
        });

        const dots = Array.from(progress.querySelectorAll("button"));

        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              const idx = Number(entry.target.getAttribute("data-index"));
              dots.forEach((d, i) => {
                if (i === idx) d.setAttribute("aria-current", "true");
                else d.removeAttribute("aria-current");
              });
            });
          },
          { root: deck, threshold: 0.6 }
        );

        slides.forEach((s) => io.observe(s));
      })();
    </script>
  </body>
</html>
