<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      content="Bahno Jung의 사진 포트폴리오. 다양한 작품을 한눈에 감상해 보세요."
    />
    <link rel="icon" href="data:," />
    <link rel="shortcut icon" href="data:," />
    <link rel="apple-touch-icon" href="data:," />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bahno Jung" />
    <meta property="og:description" content="Bahno Jung의 사진 포트폴리오. 다양한 작품을 한눈에 감상해 보세요." />
    <meta property="og:image" content="https://bahnojung.github.io/og-bahnojung-v2.png?v=20260331b" />
    <meta property="og:image:secure_url" content="https://bahnojung.github.io/og-bahnojung-v2.png?v=20260331b" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bahno Jung" />
    <meta name="twitter:description" content="Bahno Jung의 사진 포트폴리오. 다양한 작품을 한눈에 감상해 보세요." />
    <meta name="twitter:image" content="https://bahnojung.github.io/og-bahnojung-v2.png?v=20260331b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=20260816theme2" />
    <script>
      (function () {
        try {
          if (sessionStorage.getItem("bahno-home-theme") === "dark") {
            document.documentElement.classList.add("home-theme-dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="main-page">
    <nav class="collection-nav" id="collection-nav">
      <!-- collections.json을 통해 자동으로 메뉴가 렌더링됩니다. -->
    </nav>

    <header class="site-header">
      <div class="header-inner">
        <div>
          <h1 class="site-title">
            <a href="index.html" class="site-title-link">Bahno Jung</a>
          </h1>
        </div>
      </div>
    </header>

    <main class="main-blank">
      <!-- 메인: 로고 아래 흰 공백 -->
    </main>

    <button
      type="button"
      class="cursed-refresh"
      id="cursed-refresh"
      aria-label="새로고침"
      hidden
    >
      <span class="cursed-refresh-base" aria-hidden="true"></span>
      <span class="cursed-refresh-rim" aria-hidden="true"></span>
      <span class="cursed-refresh-face" aria-hidden="true"></span>
    </button>

    <script>
      const MONDRIAN_COLORS = ["#FFD000", "#E53935", "#1565C0", "#00C853", "#FF4081"];

      function colorizeLetters(element) {
        const text = element.textContent || "";
        element.textContent = "";
        let prevColor = null;
        for (const ch of text) {
          if (ch === " ") {
            element.appendChild(document.createTextNode(" "));
            continue;
          }
          const choices = prevColor
            ? MONDRIAN_COLORS.filter((c) => c !== prevColor)
            : MONDRIAN_COLORS;
          const color = choices[Math.floor(Math.random() * choices.length)];
          prevColor = color;
          const span = document.createElement("span");
          span.textContent = ch;
          span.style.color = color;
          element.appendChild(span);
        }
      }

      // 컬렉션 메뉴 로드 (WALL, COLLECTION#1, COLLECTION#2)
      async function loadSidebar() {
        const nav = document.getElementById("collection-nav");
        if (!nav) return;

        let currentId = "index";
        if (window.location.pathname.includes("collection.html")) {
          currentId = new URLSearchParams(window.location.search).get("collection") || "";
        }

        try {
          const res = await fetch("collections.json", { cache: "no-store" });
          if (!res.ok) return;
          const collections = await res.json();
          if (!Array.isArray(collections)) return;

          function displayName(id) {
            return id && id.startsWith("_") ? id.slice(1) : (id || "");
          }
          collections.forEach((collection, index) => {
            const link = document.createElement("a");
            link.href = "collection.html?collection=" + encodeURIComponent(collection.id);
            link.textContent = displayName(collection.id);
            link.className = "sidebar-link";
            if (collection.id === currentId) link.classList.add("active");
            // _ 로 시작하는 컬렉션은 맨 위에 표시하고 아래 간격 추가
            if (collection.id.startsWith("_")) {
              link.classList.add("wall-link");
            }
            colorizeLetters(link);
            nav.appendChild(link);
          });
        } catch (e) {}
      }

      function placeCursedRefresh() {
        const btn = document.getElementById("cursed-refresh");
        if (!btn) return;

        // 참고 사진 색: 파랑·노랑·흰색·빨강·초록 (검정 제외)
        const palette = [
          { name: "blue", face: "#1e6fff", hi: "#5a9bff", lo: "#0d47d1" },
          { name: "yellow", face: "#ffd400", hi: "#ffe566", lo: "#e6b800" },
          { name: "white", face: "#f2f2f2", hi: "#ffffff", lo: "#d0d0d0" },
          { name: "red", face: "#e60000", hi: "#ff4040", lo: "#b30000" },
          { name: "green", face: "#1db954", hi: "#4dff88", lo: "#128a3c" },
        ];
        let lastName = "";
        try {
          lastName = sessionStorage.getItem("cursed-refresh-color") || "";
        } catch (e) {}
        const choices = palette.filter(function (c) {
          return c.name !== lastName;
        });
        const swatch =
          (choices.length ? choices : palette)[
            Math.floor(Math.random() * (choices.length || palette.length))
          ];
        try {
          sessionStorage.setItem("cursed-refresh-color", swatch.name);
        } catch (e) {}
        btn.classList.add("is-" + swatch.name);
        btn.style.setProperty("--btn-face", swatch.face);
        btn.style.setProperty("--btn-face-hi", swatch.hi);
        btn.style.setProperty("--btn-face-lo", swatch.lo);

        const vw = Math.max(document.documentElement.clientWidth, 320);
        const vh = Math.max(document.documentElement.clientHeight, 480);
        const isMobile = window.matchMedia("(max-width: 640px)").matches;
        const size = isMobile ? 21 + Math.random() * 5 : 48 + Math.random() * 10;
        const h = size;
        const pad = 16;
        const clear = 28;

        const avoidEls = [
          document.getElementById("collection-nav"),
          document.querySelector("body.main-page .site-header"),
          document.querySelector(".music-toggle"),
        ].filter(Boolean);

        function hitsAvoid(left, top) {
          const a = {
            left: left,
            top: top,
            right: left + size,
            bottom: top + h,
          };
          return avoidEls.some(function (el) {
            const r = el.getBoundingClientRect();
            if (r.width < 2 || r.height < 2) return false;
            return !(
              a.right < r.left - clear ||
              a.left > r.right + clear ||
              a.bottom < r.top - clear ||
              a.top > r.bottom + clear
            );
          });
        }

        // 앨범 목록·로고 위쪽 빈 공간만 사용
        const nav = document.getElementById("collection-nav");
        const navTop = nav ? nav.getBoundingClientRect().top : vh * 0.55;
        const topMin = pad;
        const topMax = Math.max(pad, Math.min(vh * 0.38, navTop - clear) - h);
        const leftMin = pad;
        const leftMax = Math.max(pad, vw - size - pad);

        let top = topMin;
        let left = leftMin;
        let placed = false;
        for (let i = 0; i < 48; i++) {
          const t = topMin + Math.random() * Math.max(0, topMax - topMin);
          const l = leftMin + Math.random() * Math.max(0, leftMax - leftMin);
          if (!hitsAvoid(l, t)) {
            top = t;
            left = l;
            placed = true;
            break;
          }
        }
        if (!placed) {
          left = Math.random() < 0.5 ? pad : Math.max(pad, vw - size - pad);
          top = pad + Math.random() * Math.max(0, Math.min(80, topMax - topMin));
        }

        btn.style.setProperty("--cursed-size", size.toFixed(0) + "px");
        btn.style.top = top.toFixed(0) + "px";
        btn.style.left = left.toFixed(0) + "px";
        btn.style.setProperty("--cursed-rot", "0deg");
        btn.hidden = false;

        btn.addEventListener("click", function () {
          btn.classList.add("is-pressed");
          try {
            var next =
              sessionStorage.getItem("bahno-home-theme") === "dark"
                ? "light"
                : "dark";
            sessionStorage.setItem("bahno-home-theme", next);
          } catch (e) {}
          window.setTimeout(function () {
            window.location.reload();
          }, 160);
        });
      }

      if (document.documentElement.classList.contains("home-theme-dark")) {
        document.body.classList.add("theme-dark");
      }

      loadSidebar().then(function () {
        requestAnimationFrame(placeCursedRefresh);
      });
    </script>
    <script src="music.js" defer></script>
  </body>
</html>
